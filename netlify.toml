[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Das Export-Repo enthält ein Lockfile, das npm streng prüft; die Abweichung ist
  # baukasten-bedingt, --legacy-peer-deps löst sie reproduzierbar auf.
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*/index.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate, no-cache"
