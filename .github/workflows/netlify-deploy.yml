name: Deploy (Netlify)

# Automatischer Deploy für autoservice.askproai.com.
# Netlify kann dieses Repository nicht direkt ziehen (die Git-Verknüpfung des Projekts ist nicht
# autorisiert), daher baut und deployt GitHub Actions selbst über die Netlify-CLI.
# Benötigt die Repository-Secrets NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Bauen und zu Netlify deployen
        run: npx --yes netlify-cli@latest deploy --build --prod --message "GitHub Actions ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
